# napi/decmpfs/npm/<triple> stays OUT of this list on purpose: those dirs are
# gitignored generated output, and as workspace members `linkWorkspacePackages`
# resolves napi/decmpfs's @decmpfs/<triple> optionalDependencies to `link:`
# specs whenever they exist at a matching version. The publish engine finds
# them by convention instead (publish-infra/npm/workspace.mts:200-280).
packages:
  - napi/*
  - '.config/fleet/oxlint-plugin'
  - '.config/fleet/oxlint-plugin/fleet/*'
  - '.claude/hooks/fleet/*'
trustPolicy: no-downgrade
minimumReleaseAge: 10080
blockExoticSubdeps: true
confirmModulesPurge: false
managePackageManagerVersions: false
pmOnFail: warn
linkWorkspacePackages: true
# Pinned dev-tool versions shared via `catalog:` references in package.json.
catalog:
  '@redwoodjs/agent-ci': 0.17.1
  '@resvg/resvg-wasm': 2.6.2
  '@shadscan/cli': 0.2.0
