name: 'publish: npm addons'
run-name: 'publish: npm addons'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  napi-matrix:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    name: Plan native addon matrix
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          FETCH_ARGS=(--no-tags --prune --depth 1 origin "${TRIGGER_REF}")
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
            git fetch "${FETCH_ARGS[@]}"
          else
            git fetch "${FETCH_ARGS[@]}"
          fi
          git checkout -q --detach FETCH_HEAD
      - name: Snapshot native build controllers
        shell: bash
        run: |
          set -euo pipefail
          install -m 0600 scripts/fleet/registry/napi-matrix.mts "$RUNNER_TEMP/napi-matrix.mts"
          install -m 0600 scripts/fleet/npm/native/build.mts "$RUNNER_TEMP/native-build.mts"
          install -m 0600 scripts/fleet/npm/native-artifact-files.mts "$RUNNER_TEMP/native-artifact-files.mts"
          install -m 0600 scripts/fleet/npm/native-artifacts.mts "$RUNNER_TEMP/native-artifacts.mts"
      - name: Set up and install
        uses: ./.github/actions/fleet/setup-and-install
        with:
          socket-api-token: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
          checkout-ref: ${{ github.sha }}
          payload-token-client-id: ${{ secrets.SOCKET_RELEASE_CLIENT_ID || vars.SOCKET_RELEASE_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_RELEASE_APP_PRIVATE_KEY }}
      - name: Restore source-bound native build controllers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/fleet/npm/native
          install -m 0600 "$RUNNER_TEMP/napi-matrix.mts" scripts/fleet/registry/napi-matrix.mts
          install -m 0600 "$RUNNER_TEMP/native-build.mts" scripts/fleet/npm/native/build.mts
          install -m 0600 "$RUNNER_TEMP/native-artifact-files.mts" scripts/fleet/npm/native-artifact-files.mts
          install -m 0600 "$RUNNER_TEMP/native-artifacts.mts" scripts/fleet/npm/native-artifacts.mts
      - id: gen
        name: Derive napi build matrix
        run: |
          set -euo pipefail
          MATRIX="$(node scripts/fleet/registry/napi-matrix.mts --print-matrix)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  napi-build:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    name: 'Build (${{ matrix.target }})'
    needs: napi-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.napi-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          FETCH_ARGS=(--no-tags --prune --depth 1 origin "${TRIGGER_REF}")
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
            git fetch "${FETCH_ARGS[@]}"
          else
            git fetch "${FETCH_ARGS[@]}"
          fi
          git checkout -q --detach FETCH_HEAD
      - name: Snapshot native build controllers
        shell: bash
        run: |
          set -euo pipefail
          install -m 0600 scripts/fleet/registry/napi-matrix.mts "$RUNNER_TEMP/napi-matrix.mts"
          install -m 0600 scripts/fleet/npm/native/build.mts "$RUNNER_TEMP/native-build.mts"
          install -m 0600 scripts/fleet/npm/native-artifact-files.mts "$RUNNER_TEMP/native-artifact-files.mts"
          install -m 0600 scripts/fleet/npm/native-artifacts.mts "$RUNNER_TEMP/native-artifacts.mts"
      - name: 'Check out source'
        uses: ./.github/actions/fleet/checkout
        with:
          checkout-ref: ${{ github.sha }}
          payload-token-client-id: ${{ secrets.SOCKET_RELEASE_CLIENT_ID || vars.SOCKET_RELEASE_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_RELEASE_APP_PRIVATE_KEY }}
      - name: 'Set up and install'
        uses: ./.github/actions/fleet/setup-and-install
        with:
          socket-api-token: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
          # Reuse the Release App for a contents:read token scoped to wheelhouse.
          # Both credentials enable the private release fallback. Without the
          # key, hydration still pulls public GHCR anonymously.
          checkout-ref: ${{ github.sha }}
          payload-token-client-id: ${{ secrets.SOCKET_RELEASE_CLIENT_ID || vars.SOCKET_RELEASE_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_RELEASE_APP_PRIVATE_KEY }}
      - name: Restore source-bound native build controllers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/fleet/npm/native
          install -m 0600 "$RUNNER_TEMP/napi-matrix.mts" scripts/fleet/registry/napi-matrix.mts
          install -m 0600 "$RUNNER_TEMP/native-build.mts" scripts/fleet/npm/native/build.mts
          install -m 0600 "$RUNNER_TEMP/native-artifact-files.mts" scripts/fleet/npm/native-artifact-files.mts
          install -m 0600 "$RUNNER_TEMP/native-artifacts.mts" scripts/fleet/npm/native-artifacts.mts
      - name: Run custom native producer
        if: ${{ matrix.customBuild == true }}
        env:
          NAPI_TARGET: ${{ matrix.target }}
        run: node scripts/fleet/npm/native/build.mts
      # Socket-original composites, not the third-party Rust toolchain and
      # cache actions they replace. An addon member's Actions allowlist then
      # needs nothing beyond actions/* and its own local composites, so a grep
      # for a third-party Rust action comes back empty in every fleet member,
      # addon or not.
      - name: Rust toolchain
        if: ${{ matrix.customBuild != true }}
        uses: ./.github/actions/fleet/setup-rust-toolchain
        with:
          channel: stable
      - name: Rust cache
        if: ${{ matrix.customBuild != true }}
        uses: ./.github/actions/fleet/setup-rust-cache
        with:
          prefix-key: napi-${{ matrix.target }}
          workspaces: .
      - name: 'Prefer rustup Cargo over the SFW shim'
        if: ${{ matrix.customBuild != true }}
        shell: bash
        # The SFW proxy MITMs crates.io, and on Windows schannel rejects its
        # certificate ("revocation status is unknown"), breaking every cargo
        # network operation. Front-load the rustup toolchain dir so cargo
        # runs unshimmed; crate installs stay --locked.
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install abi (crates.io)
        if: ${{ matrix.customBuild != true }}
        shell: bash
        env:
          ABITIOUS_VERSION: 0.1.0
        run: cargo install abitious --version "$ABITIOUS_VERSION" --locked
      - name: Fetch opentui prebuilt
        if: ${{ matrix.customBuild != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_ID: ${{ matrix.platformId }}
          OPENTUI_BUILD_TAG: opentui-20260424-18f0f46
        # Exact-name download: socket-btm names each prebuilt asset
        # `<tag>-<platformId>.node`, which downloadSocketBtmRelease's generic
        # binary naming (`<tool>-<platformId>`, no tag infix or extension)
        # cannot resolve — fetch the asset directly by its exact name.
        run: |
          set -euo pipefail
          OUTPUT_DIR=".cache/fleet/native-addons/build/${PLATFORM_ID}"
          mkdir -p "$OUTPUT_DIR"
          gh release download "$OPENTUI_BUILD_TAG" -R SocketDev/socket-btm \
            --pattern "${OPENTUI_BUILD_TAG}-${PLATFORM_ID}.node" \
            --output "$OUTPUT_DIR/opentui.node"
          test -s "$OUTPUT_DIR/opentui.node" || {
            echo "opentui.node missing at $OUTPUT_DIR after the prebuilt fetch." >&2
            exit 1
          }
      - name: Build abitious stub
        if: ${{ matrix.customBuild != true }}
        shell: bash
        env:
          ABITIOUS_VERSION: 0.1.0
        # `abi build --compress` needs the self-loader stub cdylib. The
        # @abitious/* npm platform packages (its auto-resolve source) are not
        # published yet, so build the stub from the pinned abitious tag and
        # hand it to `--stub`. Cloned into the workspace so cargo paths stay
        # native on every runner OS.
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch "v${ABITIOUS_VERSION}" \
            https://github.com/SocketDev/abitious abitious-src
          cargo build --manifest-path abitious-src/Cargo.toml -p abitious-stub --release
      - name: Build + compress stuie.node
        if: ${{ matrix.customBuild != true }}
        shell: bash
        env:
          PLATFORM_ID: ${{ matrix.platformId }}
          ABITIOUS_VERSION: 0.1.0
        run: |
          set -euo pipefail
          case "$PLATFORM_ID" in
            darwin-*) STUB_FILE=libabitious_stub.dylib ;;
            win-*)    STUB_FILE=abitious_stub.dll ;;
            *)        STUB_FILE=libabitious_stub.so ;;
          esac
          abi build --compress --release -p stuie-node \
            --stub "abitious-src/target/release/${STUB_FILE}"
          OUTPUT_DIR=".cache/fleet/native-addons/build/${PLATFORM_ID}"
          mkdir -p "$OUTPUT_DIR"
          mv stuie_node.node "$OUTPUT_DIR/stuie.node"
      - name: 'Upload artifact'
        uses: ./.github/actions/fleet/upload-artifact
        with:
          if-no-files-found: error
          name: addons-${{ matrix.platformId }}
          path: .cache/fleet/native-addons/build/${{ matrix.platformId }}
      # Last step on purpose: the restore-phase call above exported the
      # RUST_CACHE_* job env; this saves the populated target dirs. Runs only
      # when every previous step succeeded — the same success gate the old
      # cache post step used.
      - name: Save Rust cache
        if: ${{ matrix.customBuild != true }}
        uses: ./.github/actions/fleet/setup-rust-cache
        with:
          phase: save
