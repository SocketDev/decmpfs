name: 'publish: npm addons'
run-name: 'publish: npm addons ${{ github.ref_name }}'

# Per-target native builds of the decmpfs node addon: the tier-1 subset on every
# push/PR (native runners, no cross C toolchain) and the FULL 8-target release
# set via workflow dispatch. The matrix is DERIVED from the single source
# of truth (napi/decmpfs/scripts/targets.mts) — adding a target there changes
# the matrix with no edit here.
#
# The windows legs download node.lib (the node.exe import library) for the napi
# build; musl legs compile and load-check inside Alpine.

on:
  push:
    branches: [main]
    paths:
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'napi/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/publish-npm-addons.yml'
  pull_request:
    paths:
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'napi/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/publish-npm-addons.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: ./.github/actions/repo/setup-pnpm
      - name: Generate platform workspace manifests
        run: node napi/decmpfs/scripts/make-npm-dirs.mts
      - name: Install workspace devdependencies
        run: pnpm install --frozen-lockfile
      - name: Test the addon build script
        run: node scripts/fleet/test.mts test/repo/unit

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - name: Derive the build matrix from targets.mts
        id: gen
        env:
          ALL_TARGETS: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs'
          // The TARGETS file is the single source of truth; the tier-1 set =
          // the native-runner targets. Emit the GitHub Actions matrix JSON.
          const src = readFileSync('napi/decmpfs/scripts/targets.mts', 'utf8')
          const all = process.env.ALL_TARGETS === 'true'
          // Parse each target block field-independently: the field order in
          // the manifest must not couple to this parser.
          const entries = src
            .split("triple: '")
            .slice(1)
            .map(block => ({
              triple: /^([^']+)'/.exec(block)?.[1],
              os: /os: '([^']+)'/.exec(block)?.[1],
              cpu: /cpu: '([^']+)'/.exec(block)?.[1],
              libc: /libc: '([^']+)'/.exec(block)?.[1],
              rust: /rust: '([^']+)'/.exec(block)?.[1],
              artifact: /artifact: '([^']+)'/.exec(block)?.[1],
            }))
            .filter(t => t.triple && t.os && t.cpu && t.rust && t.artifact)
          const tier1 = new Set([
            'darwin-arm64',
            'darwin-x64',
            'linux-arm64-gnu',
            'linux-x64-gnu',
            'win32-x64-msvc',
          ])
          const matrix = entries
            .filter(t => all || tier1.has(t.triple))
            .map(t => ({
              ...t,
              platformId: t.triple
                .replace(/-(gnu|msvc)$/, '')
                .replace(/^win32-/, 'win-'),
              runner:
                t.os === 'darwin'
                  ? t.cpu === 'arm64'
                    ? 'macos-26'
                    : 'macos-15'
                  : t.os === 'win32'
                    ? t.cpu === 'arm64'
                      ? 'windows-11-arm'
                      : 'windows-latest'
                    : t.cpu === 'arm64'
                      ? 'ubuntu-26.04-arm'
                      : 'ubuntu-26.04',
            }))
          if (!matrix.length) throw new Error('no targets resolved')
          console.log(`matrix=${JSON.stringify({ include: matrix })}`)
          JS
  build:
    name: Build (${{ matrix.triple }})
    needs: [check, prepare]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - name: Hydrate the fleet pack
        run: node scripts/repo/bootstrap/fleet.mjs --preserve-tracked
      - name: Set up Rust toolchain
        uses: ./.github/actions/fleet/setup-rust-toolchain
        with:
          channel: nightly-2026-09-24
          targets: ${{ matrix.rust }}
          components: clippy,rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2026-03-12)
        with:
          key: ${{ matrix.triple }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Download node.lib (Windows targets only)
        if: ${{ runner.os == 'Windows' }}
        env:
          TARGET_CPU: ${{ matrix.cpu }}
          WORKSPACE: ${{ github.workspace }}
        shell: pwsh
        run: |
          $v = (node -p process.version)
          $arch = if ($env:TARGET_CPU -eq "arm64") { "arm64" } else { "x64" }
          $dir = "$env:WORKSPACE/.cache/node-lib"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$v/win-$arch/node.lib" -OutFile "$dir/node.lib"
          "NODE_LIB_DIR=$dir" | Add-Content $env:GITHUB_ENV
      - name: Build musl addon in Alpine
        if: ${{ matrix.libc == 'musl' }}
        env:
          RUST_TARGET: ${{ matrix.rust }}
          PACKAGE_TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          musl_build_image='rust:alpine@sha256:0cce0a5e0e8ba67a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1' # rust Alpine musl build image
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -e RUST_TARGET -e RUST_TOOLCHAIN=nightly-2026-09-24 \
            -e CARGO_TERM_COLOR -e RUST_BACKTRACE \
            -e CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=gcc \
            -e CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=gcc \
            "$musl_build_image" \
            sh -ec 'apk add --no-cache build-base cmake perl linux-headers; rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal; rustup target add --toolchain "$RUST_TOOLCHAIN" "$RUST_TARGET"; exec rustup run "$RUST_TOOLCHAIN" cargo build --locked --release --target "$RUST_TARGET" -p decmpfs-node'
          mkdir -p "npm-out/$PACKAGE_TRIPLE"
          cp "target/$RUST_TARGET/release/libdecmpfs_node.so" "npm-out/$PACKAGE_TRIPLE/decmpfs.node"
      - name: Build non-musl addon
        if: ${{ matrix.libc != 'musl' }}
        env:
          RUST_TARGET: ${{ matrix.rust }}
          PACKAGE_TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          cd napi/decmpfs
          PATH="$HOME/.cargo/bin:$PATH" node scripts/build.mts --prod --target "$RUST_TARGET"
          mkdir -p "../../npm-out/$PACKAGE_TRIPLE"
          cp decmpfs.node "../../npm-out/$PACKAGE_TRIPLE/decmpfs.node"
      - name: Check musl addon in Alpine
        if: ${{ matrix.libc == 'musl' }}
        run: docker run --rm -v "$GITHUB_WORKSPACE/npm-out/${{ matrix.triple }}/decmpfs.node:/tmp/decmpfs.node:ro" node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1 node -e 'require("/tmp/decmpfs.node")' # node 24 alpine
      - name: Upload the built addon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (2026-04-10)
        with:
          name: addons-${{ matrix.platformId }}
          path: npm-out/${{ matrix.triple }}
