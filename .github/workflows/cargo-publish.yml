name: 📦 Cargo Publish

# PRESET — seeded once from template/presets/ (onboarding or first cascade),
# then repo-owned: customize what + how THIS crate publishes. The cargo analog
# of npm-publish.yml.
#
# Default flow: manual dispatch, DRY-RUN unless `publish: true`; publishes the
# workspace's publishable crate via the fleet cargo-publish engine using
# crates.io Trusted Publishing (OIDC — id-token: write, no long-lived token)
# with build provenance. The `cargo-publish` CI environment gates the real,
# PERMANENT publish (crates.io is yank-only) — configure required reviewers +
# the crates.io trusted-publisher (repo + this workflow + environment) on it.
#
# ORDER RULE: the engine publishes FIRST, then gates the git tag + immutable
# GH release on the version being resolvable in the crates.io index
# (requireRegistryLive) — the release is the FINAL marker and never precedes
# the registry publish.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish for real (false = dry-run, the default).'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Same-named CI environment: the human-approval + OIDC gate for the
    # PERMANENT publish; a dry-run is ungated.
    environment: ${{ inputs.publish == true && 'cargo-publish' || '' }}
    permissions:
      contents: write # cargo-publish.mts tags + cuts the GitHub release
      id-token: write # crates.io Trusted Publishing (OIDC) + provenance
      attestations: write # build provenance for the .crate
    env:
      SOCKET_API_KEY: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
    steps:
      - name: Setup + install
        uses: ./.github/actions/fleet/setup-and-install
      # Fleet composites, not the third-party actions they replace: a raw
      # `uses:` here would force dtolnay/rust-toolchain and Swatinem/rust-cache
      # onto the Actions allowlist of every repo seeded from this preset, and a
      # strict-allowlist repo plan-fails with 0 jobs when one is missing.
      - name: Rust toolchain
        uses: ./.github/actions/fleet/setup-rust-toolchain
        with:
          channel: nightly
      - name: Rust cache
        uses: ./.github/actions/fleet/setup-rust-cache
        with:
          prefix-key: cargo-publish
          workspaces: .
      # The fleet's own OIDC exchange, not rust-lang/crates-io-auth-action.
      # Same protocol, no third-party action in the publish path, and nothing
      # to re-pin when upstream retags: that action's floating `v1` tag was
      # deleted out from under our pin.
      - name: crates.io auth (OIDC Trusted Publishing)
        id: auth
        if: ${{ inputs.publish == true }}
        uses: ./.github/actions/fleet/crates-io-auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        # The rustup cargo goes AHEAD of the SFW shim for the publish leg:
        # the shim's proxy interposes the crates.io publish PUT (uploads are
        # outside its registry-read bypass), and cargo then fails TLS
        # verification with curl error 60. Reads (index, downloads) already
        # happened in earlier steps under the shim; the upload is outbound
        # publish traffic with an OIDC token — no supply-chain read surface.
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          node scripts/fleet/cargo-publish.mts ${{ inputs.publish == true && '--direct' || '--staged --dry-run' }}
      # A composite action cannot declare a `post` hook, so the revoke is an
      # explicit step. `always()` on purpose: a failed publish still minted a
      # token, and leaving it live until it expires is the worse outcome.
      - name: Revoke the crates.io token
        if: ${{ always() && steps.auth.outputs.token != '' }}
        env:
          CRATES_IO_TOKEN: ${{ steps.auth.outputs.token }}
        run: node scripts/fleet/registry-infra/crates-io-trusted-token.mts --revoke
      - name: Attest build provenance (.crate)
        if: ${{ inputs.publish == true }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2 (2025-06-11)
        with:
          subject-path: target/package/*.crate
