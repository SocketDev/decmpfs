name: 📦 Publish npm
run-name: Publish npm

# decmpfs napi-matrix variant, shipped via the override channel
# (template/overrides/decmpfs/ — same pattern as stuie's interim matrix and
# socket-cli's frozen variant). The engine flow is the byte-canonical shell
# (checkout → setup-and-install → build → scripts/fleet/npm-publish.mts)
# with ONE addition: a five-leg `build-addons` matrix builds each platform's
# napi cdylib on its native host and the publish job stages the artifacts
# into napi/decmpfs/npm/<triple>/ before the engine runs — otherwise the
# engine's hollow-package gate (correctly) refuses the payload-less platform
# dirs. Collapses into the shared napi flavor when that lands canonically.
#
# Default flow: manual dispatch, DRY-RUN unless `publish: true`; publishes the
# workspace's publishable packages via the fleet staged-publish script with
# npm provenance (OIDC trusted publishing — id-token: write, no long-lived
# npm token).
#
# Release markers reserve the version before staging. Rejected stages burn
# the version; npm approval does not create another release.
#
# BACKFILL: to republish prior content as a skipped GAP version — 1.4.3
# between a live 1.4.2 and 1.4.4 — dispatch from MAIN, where this file always
# exists, with `backfill-version` + `checkout-ref`. The checkout-ref supplies
# the CONTENT while the workflow definition stays main's. The bump/changelog
# gate is bypassed; hard gap-fill-only guards replace it (never-published
# version, lower than latest, non-latest dist-tag, content declares its own
# version) — see scripts/fleet/registry-infra/npm/backfill.mts.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish for real (false = dry-run, the default).'
        type: boolean
        default: false
      dist-tag:
        description: 'npm dist-tag to publish under.'
        type: string
        default: 'latest'
      backfill-version:
        description: >-
          Backfill a never-published GAP version below registry latest with
          the content at checkout-ref. Bypasses the bump/changelog gate
          behind hard gap-fill-only guards; requires checkout-ref and a
          non-latest dist-tag.
        type: string
        default: ''
      checkout-ref:
        description: >-
          Backfill only — the branch/tag/SHA whose CONTENT is republished.
          The workflow definition always comes from the dispatched ref,
          main, so historical content stays reachable.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One leg per shipped platform (napi/decmpfs/scripts/targets.mts is the
  # name/loader source of truth; this include list mirrors it and pins each
  # triple to its native runner). Each leg cargo-builds the decmpfs-node
  # cdylib, stages it into its napi/decmpfs/npm/<triple>/ dir via
  # make-npm-dirs.mts (host-copy branch), and uploads the .node payload for
  # the publish job to stage back in.
  build-addons:
    name: 'Build (${{ matrix.triple }})'
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: darwin-arm64
            runner: macos-14
          - triple: darwin-x64
            runner: macos-15-intel
          - triple: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - triple: linux-x64-gnu
            runner: ubuntu-latest
          - triple: win32-x64-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      SOCKET_API_KEY: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
    steps:
      # Inline git fetch, not a local composite: this is the job's first step, so
      # ./.github/actions/* is not on disk yet. Not actions/checkout either - the
      # fleet ships no third-party actions. Same shape every other fleet workflow
      # bootstraps with; the credential is never persisted to .git/config.
      - name: Bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TARGET_REF: ${{ inputs.checkout-ref || github.ref }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          FETCH_ARGS=(--no-tags --prune --depth 1 origin "${TARGET_REF}")
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
            git fetch "${FETCH_ARGS[@]}"
          else
            git fetch "${FETCH_ARGS[@]}"
          fi
          git checkout -q --detach FETCH_HEAD
      - name: 'Set up Node.js'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (2026-06-29)
        with:
          node-version: 24
      - name: 'Set up SFW'
        uses: ./.github/actions/repo/setup-sfw
      - name: Build addon
        working-directory: napi/decmpfs
        run: node scripts/build.mts
      - name: Stage into the platform package dir
        shell: bash
        env:
          TRIPLE: ${{ matrix.triple }}
        # make-npm-dirs host-copies target/release/<artifact> into the host
        # triple's dir; the test asserts the runner↔triple mapping above is
        # right (a mismapped leg would stage into a DIFFERENT triple's dir
        # and this leg's upload would be empty).
        run: |
          set -euo pipefail
          node napi/decmpfs/scripts/make-npm-dirs.mts
          test -s "napi/decmpfs/npm/${TRIPLE}/decmpfs.${TRIPLE}.node" || {
            echo "× napi/decmpfs/npm/${TRIPLE}/ has no staged .node — runner/triple mismatch?" >&2
            exit 1
          }
      # The fleet's own uploader, not actions/upload-artifact. Same three
      # inputs, backed by scripts/fleet/artifact/upload.mts, so there is no
      # third-party action in the publish path and no pinned sha to keep
      # chasing when upstream retags.
      - name: 'Upload artifact'
        uses: ./.github/actions/fleet/upload-artifact
        with:
          if-no-files-found: error
          name: addon-${{ matrix.triple }}
          path: napi/decmpfs/npm/${{ matrix.triple }}/*.node

  publish:
    name: Publish npm
    needs: build-addons
    runs-on: ubuntu-latest
    # npm's trusted-publisher config pins this GitHub environment name; the
    # OIDC token exchange 404s if the job runs outside it.
    environment: npm-publish
    permissions:
      contents: read
      # npm provenance / trusted publishing mints its OIDC token here.
      id-token: write
    env:
      # Socket Firewall + CLI auth for the sfw-wrapped setup + pnpm install —
      # sfw and socket-cli read SOCKET_API_KEY from the org-wide secret.
      SOCKET_API_KEY: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
    steps:
      # Inline git fetch, not a local composite: this is the job's first step,
      # so ./.github/actions/* is not on disk yet. Not actions/checkout either
      # - the fleet ships no third-party actions. setup-and-install re-checks
      # out at its own deeper default below.
      #
      # TAGS are fetched, not skipped. The bump derivation anchors on
      # registry-latest plus the last v-tag, and on a first-publish repo the
      # registry has nothing, so the tags are the only anchor - a tagless
      # checkout makes the engine derive from zero (0.1.0) and trip the
      # half-applied-bump gate on historical CHANGELOG sections (decmpfs run
      # 30226873755).
      - name: Bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TARGET_REF: ${{ inputs.checkout-ref || github.ref }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          FETCH_ARGS=(--prune --depth 1 origin "${TARGET_REF}")
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
            git fetch --tags "${FETCH_ARGS[@]}"
          else
            git fetch --tags "${FETCH_ARGS[@]}"
          fi
          git checkout -q --detach FETCH_HEAD
      - name: Set up and install
        uses: ./.github/actions/fleet/setup-and-install
        with:
          # Forward the backfill content ref — setup-and-install re-checks-out
          # internally (fleet checkout falls back to the TRIGGERING ref when
          # unset), which would silently swap the backfill content back to
          # main's tree; the backfill gate then refuses against main's
          # version. Empty forwards as unset, so normal dispatches keep the
          # dispatched-ref re-checkout.
          checkout-ref: ${{ inputs.checkout-ref }}
          # Reuse the PR App for a contents:read token scoped to wheelhouse.
          # Both credentials enable the private release fallback. Without the
          # key, hydration still pulls public GHCR anonymously.
          payload-token-client-id: ${{ secrets.SOCKET_PR_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_PR_APP_PRIVATE_KEY }}
      # Build dist/ before publishing — the staged-publish script imports the
      # package's own built output (`@socketsecurity/lib/stdio/prompts` self-
      # resolves to dist/), and `files` ships dist/, so the tarball needs it.
      - name: Build
        run: pnpm run build
      # The fleet's downloader, not actions/download-artifact. No name = every
      # artifact in the run, each under staged-addons/<name>/ - one per
      # build-addons leg.
      - name: 'Download artifact'
        uses: ./.github/actions/fleet/download-artifact
        with:
          path: staged-addons
      # Every platform's payload lands in its package dir BEFORE the engine
      # runs, so the hollow-package gate sees six publishable packages. The
      # bump's own make-npm-dirs pass rewrites manifests but never deletes a
      # staged .node, so ordering here is safe.
      - name: Stage platform addons
        shell: bash
        run: |
          set -euo pipefail
          node napi/decmpfs/scripts/make-npm-dirs.mts
          for dir in staged-addons/addon-*; do
            triple="${dir#staged-addons/addon-}"
            dest="napi/decmpfs/npm/${triple}"
            test -d "$dest" || {
              echo "× no generated platform dir for ${triple}." >&2
              exit 1
            }
            cp "$dir"/*.node "$dest/"
          done
      # The release App reserves the signed bump before staging.
      - name: 'Mint release token'
        if: ${{ inputs.backfill-version == '' }}
        id: release-app
        uses: ./.github/actions/fleet/github-release-app-token
        with:
          client-id: ${{ secrets.SOCKET_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.SOCKET_RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      # Rejected staging consumes the reserved version.
      - name: Publish
        env:
          BACKFILL_VERSION: ${{ inputs.backfill-version }}
          CHECKOUT_REF: ${{ inputs.checkout-ref }}
          DIST_TAG: ${{ inputs.dist-tag }}
          RELEASE_APP_TOKEN: ${{ steps.release-app.outputs.token }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        # CHECKOUT_REF forwards on its own so a checkout-ref dispatch WITHOUT
        # backfill-version is refused by the script instead of silently
        # bump-publishing historical content.
        run: node scripts/fleet/npm-publish.mts --tag "$DIST_TAG" ${BACKFILL_VERSION:+--backfill "$BACKFILL_VERSION"} ${CHECKOUT_REF:+--checkout-ref "$CHECKOUT_REF"} ${{ inputs.publish != true && '--dry-run' || '' }}
