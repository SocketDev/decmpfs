name: "ci: gates"

# Dependencies: none — self-contained.
#
# Every push/PR: zizmor audits the workflows, then the matrix builds the crate
# and the napi addon on each publish platform's OS family and runs both test
# suites plus the crate/npm version-parity gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No-phone-home posture: every tool this CI touches runs telemetry-off.
env:
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
  COREPACK_ENABLE_PROJECT_SPEC: '0'
  DISABLE_TELEMETRY: '1'
  DO_NOT_TRACK: '1'
  NO_UPDATE_NOTIFIER: '1'
  OTEL_SDK_DISABLED: 'true'

jobs:
  audit:
    name: 🛡️ Audit workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor (pinned, integrity-verified)
        run: |
          set -euo pipefail
          VERSION="v1.25.2"
          ASSET="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          SHA512_B64="FSmYWvlOzySHwlI2IkoEQNHfRU/UitumuQJc+umYyYcDr50colg0Bzio74YS19sGH41leMdXu4KJtB5XM45eUg=="
          curl -fsSL --retry 3 -o /tmp/zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/${VERSION}/${ASSET}"
          GOT="$(openssl dgst -sha512 -binary /tmp/zizmor.tar.gz | openssl base64 -A)"
          if [ "$GOT" != "$SHA512_B64" ]; then
            echo "zizmor integrity mismatch for ${ASSET}@${VERSION}" >&2
            echo "  expected sha512(b64): $SHA512_B64" >&2
            echo "  got      sha512(b64): $GOT" >&2
            echo "  Fix: re-pin VERSION + SHA512_B64 in ci.yml" >&2
            exit 1
          fi
          tar -xzf /tmp/zizmor.tar.gz -C /tmp
          install -m 0755 "$(find /tmp -maxdepth 2 -name zizmor -type f | head -1)" /usr/local/bin/zizmor
      - name: Audit .github
        run: zizmor --min-severity medium .github/

  test:
    name: 🧪 Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - uses: ./.github/actions/repo/setup-pnpm
      - name: Generate platform workspace manifests
        run: node napi/decmpfs/scripts/make-npm-dirs.mts
      - name: Install workspace devDependencies
        run: pnpm install --frozen-lockfile
      - name: Read Rust toolchain pin
        id: rust-pin
        shell: bash
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs'
          import { parseRustToolchainPin } from './scripts/fleet/setup/rust.mts'
          const channel = parseRustToolchainPin(readFileSync('rust-toolchain.toml', 'utf8'))
          if (!channel) throw new Error('Missing Rust toolchain channel')
          console.log(`channel=${channel}`)
          JS
      - uses: ./.github/actions/fleet/setup-rust-toolchain
        with:
          channel: ${{ steps.rust-pin.outputs.channel }}
          components: clippy,rustfmt
      - name: Check (fmt + clippy + version parity)
        run: node scripts/repo/check.mts --rust-only
      - name: Test crate
        shell: bash
        run: '"$SFW_BIN" cargo test --workspace --locked'
      - name: Build addon
        working-directory: napi/decmpfs
        run: node scripts/build.mts
      - name: Test addon
        working-directory: napi/decmpfs
        run: node --test

  typecheck:
    name: 🧷 Typecheck (.d.cts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - uses: ./.github/actions/repo/setup-pnpm
      - name: Generate platform workspace manifests
        run: node napi/decmpfs/scripts/make-npm-dirs.mts
      - name: Install workspace devDependencies
        run: pnpm install --frozen-lockfile
      - name: Check declarations and assets
        run: node scripts/repo/check.mts --node-only
